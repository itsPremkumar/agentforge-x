[project]
name = "agentforge-x"
version = "0.1.0"
description = "Advanced OSS framework: DeepAgents planning × LangGraph orchestration — core kernel"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.3.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.7.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
agentforge-x = "agentforge_x.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_x"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "SIM", "UP"]
ignore = ["UP007"]  # allow Optional from typing

[tool.ruff.lint.isort]
known-first-party = ["agentforge_x"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/agentforge_x/kernel --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["src/agentforge_x"]
branch = true
