[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-x"
version = "1.0.0"
description = "Six-agent fleet with versioned prompts, rubric judging, and thin kernel loop"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Hermes Agent Team", email = "agentforge-x@hermes.local"}
]
keywords = ["agents", "ai", "multi-agent", "fleet", "debate", "consensus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typing-extensions>=4.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "langchain-core>=0.4",
    "langgraph>=1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
agentforge = "agentforge_x.cli:main"

[project.urls]
Homepage = "https://github.com/NousResearch/hermes-agent"
Documentation = "https://hermes-agent.nousresearch.com/docs/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"agentforge_x" = ["presets.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
