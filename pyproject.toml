[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-toolbox"
version = "0.1.0"
description = "A curated collection of MCP servers: filesystem-safe, git-inspector, board-reader."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nous Research", email = "devbox@nousresearch.com" },
]
keywords = ["mcp", "model-context-protocol", "ai", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
mcp-toolbox-filesystem-safe = "mcp_toolbox.filesystem_safe:main"
mcp-toolbox-git-inspector = "mcp_toolbox.git_inspector:main"
mcp-toolbox-board-reader = "mcp_toolbox.board_reader:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_toolbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
